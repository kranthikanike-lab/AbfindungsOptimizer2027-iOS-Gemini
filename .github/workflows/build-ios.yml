name: Verify Tax Engine 2027

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-engine:
    name: Test 2027 Tax & Solver Math
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Statutory Tax Engine Tests (Node.js)
        run: |
          node -e '
            const fs = require("fs");
            const code = fs.readFileSync("Shared/TaxEngine2027.js", "utf8");
            eval(code);
            const res = runSimulation({
              altesMonatsgehalt: 8333,
              fristMonate: 5,
              bruttoAbfindung: 120000,
              agFiktivGehalt: 100000,
              neuesGehalt2027: 25000,
              turboEnabled: true,
              turboFaktor: 1.5
            });
            console.log("Simulation Output:", JSON.stringify(res, null, 2));
            if (res.optimalNettoTotal <= 0) throw new Error("Invalid output");
          '
