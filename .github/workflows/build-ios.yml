- name: Run 2027 Tax Engine & Auto-Solver Assertions
        run: |
          node -e '
          const fs = require("fs");
          const assert = require("assert");
          const vm = require("vm");

          const code = fs.readFileSync("Shared/TaxEngine2027.js", "utf8");
          const sandbox = { console };
          vm.createContext(sandbox);
          vm.runInContext(code, sandbox);

          function check(label, fn) {
            fn();
            console.log("✅ PASS:", label);
          }

          const baseInput = {
            altesMonatsgehalt: 8333,
            fristMonate: 5,
            bruttoAbfindung: 120000,
            agFiktivGehalt: 100000,
            neuesGehalt2027: 25000,
            kvZusatzbeitragPct: 2.5,
            preExitGkv: "Pflichtversichert (§ 19 Abs. 2 SGB V)",
            isSplitting: false,
            partnerGehalt2027: 0,
            churchRate: 0.0,
            turboEnabled: false,
            turboFaktor: 1.5,
            alg1SatzPct: 60.0,
            includeAlg1Loss: false,
            solverMode: "manual",
            customSolverOrder: ["bav", "drv", "ruerup", "iab"],
            bavAmount: 0,
            drvV0210Amount: 0,
            ruerupAmount: 0,
            pvIabPurchase: 0,
            monthlyExpenses: 3500,
            alg1ClaimMonths: 12,
            postAlg1GkvMode: "Mindestbeitrag",
            newJobGrossAnnual: 65000,
            salaryGrowthPct: 2.0
          };

          const resBase = sandbox.runSimulation(baseInput);
          check("1. Fünftelregelung & Okt. 2028 Refund (Sofort: " + Math.round(resBase.sofortNetto2027) + " €, Refund: +" + Math.round(resBase.finanzamtRefundOct2028) + " €)", () => {
            assert(resBase.sofortNetto2027 > 0);
            assert(resBase.finanzamtRefundOct2028 > 0);
            assert(Math.abs(resBase.optimalNettoTotal - (resBase.sofortNetto2027 + resBase.finanzamtRefundOct2028)) < 1);
            assert(resBase.ruerupCapRemaining > 0 && resBase.ruerupCapRemaining <= 32308);
          });

          const resSprinter = sandbox.runSimulation({ ...baseInput, turboEnabled: true, turboFaktor: 1.5 });
          check("2. Sprinter & § 158 SGB III Ruhenszeit (" + resSprinter.ruhenszeitMonths + " Mo, Runway: " + resSprinter.sprinterRunwayMonths.toFixed(1) + " Mo)", () => {
            assert(resSprinter.ruhenszeitMonths >= 1 && resSprinter.ruhenszeitMonths <= 5);
            assert(Array.isArray(resSprinter.waterfallSteps) && resSprinter.waterfallSteps.length >= 4);
            assert(resSprinter.sprinterRunwayMonths > 0);
          });

          const resOptimal = sandbox.runSimulation({ ...baseInput, solverMode: "optimal" });
          check("3. Auto-Solver Optimal-Netto (bAV: " + Math.round(resOptimal.solvedBav) + " €, Rürup: " + Math.round(resOptimal.solvedRuerup) + " €, PV: " + Math.round(resOptimal.solvedPvPurchase) + " €)", () => {
            assert(resOptimal.solvedBav > 0 || resOptimal.solvedRuerup > 0 || resOptimal.solvedPvPurchase > 0);
            assert(resOptimal.solvedBav <= 50976);
            assert(resOptimal.solvedPvPurchase <= 400000);
          });

          const resLiquidity = sandbox.runSimulation({ ...baseInput, solverMode: "liquidity" });
          check("4. Auto-Solver Liquiditäts-Fokus (0 € locked in bAV/DRV/Rürup)", () => {
            assert.strictEqual(resLiquidity.solvedBav, 0);
            assert.strictEqual(resLiquidity.solvedDrv, 0);
            assert.strictEqual(resLiquidity.solvedRuerup, 0);
          });

          const resRetirement = sandbox.runSimulation({ ...baseInput, solverMode: "retirement" });
          check("5. Auto-Solver Altersvorsorge (0 € PV-IAB, Pension active)", () => {
            assert.strictEqual(resRetirement.solvedPvPurchase, 0);
            assert(resRetirement.solvedBav > 0 || resRetirement.solvedRuerup > 0);
          });

          const resCustom = sandbox.runSimulation({ ...baseInput, solverMode: "custom", customSolverOrder: ["ruerup", "bav", "drv", "iab"] });
          check("6. Auto-Solver Custom Priority Order", () => {
            assert(resCustom.solvedRuerup >= 0 && resCustom.solvedBav <= 50976);
          });

          check("7. Section D Gehalts-Switch Break-Even (" + resBase.crossoverPoints.length + " yrs, Break-Even Year: " + resBase.breakEvenYear + ")", () => {
            assert(Array.isArray(resBase.crossoverPoints) && resBase.crossoverPoints.length >= 10);
            assert.strictEqual(typeof resBase.breakEvenYear, "number");
          });
          '
