
name: TestFlight upload

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26-intel
    timeout-minutes: 45

    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check and normalize secrets
        shell: bash
        run: |
          set -euo pipefail

          BUNDLE_ID=$(echo -n "$BUNDLE_ID" | tr -d '[:space:]')
          TEAM_ID=$(echo -n "$TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(echo -n "$ASC_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(echo -n "$ASC_ISSUER_ID" | tr -d '[:space:]')

          if [ -z "$BUNDLE_ID" ] || [ -z "$TEAM_ID" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::error::One or more GitHub secrets are missing."
            exit 1
          fi

          if [[ ! "$ASC_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::ASC_KEY_ID format is invalid."
            exit 1
          fi

          if [[ ! "$ASC_ISSUER_ID" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
            echo "::error::ASC_ISSUER_ID format is invalid."
            exit 1
          fi

          if [[ ! "$TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::TEAM_ID format is invalid."
            exit 1
          fi

          {
            echo "BUNDLE_ID=$BUNDLE_ID"
            echo "TEAM_ID=$TEAM_ID"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

          echo "All secret formats validated."

      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)

          if [ -z "$XC" ]; then
            echo "::error::Xcode 26 not found."
            exit 1
          fi

          sudo xcode-select -s "$XC"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate

      - name: Prepare Apple API key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/private_keys"

          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "$ASC_KEY_P8" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"

          if [ ! -s "$KEY_FILE" ]; then
            echo "::error::Private key is empty."
            exit 1
          fi

          openssl pkey -in "$KEY_FILE" -noout

          echo "Private key structure is valid."

          echo "Runner UTC time:"
          date -u

          echo "Key ID length: ${#ASC_KEY_ID}"
          echo "Issuer ID length: ${#ASC_ISSUER_ID}"
          echo "Team ID length: ${#TEAM_ID}"

          echo "Public key fingerprint:"
          openssl pkey -in "$KEY_FILE" -pubout -outform DER | openssl sha256

      - name: Validate Apple API authentication
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;

          const keyPath =
            `${process.env.HOME}/private_keys/AuthKey_${keyId}.p8`;

          const key = fs.readFileSync(keyPath);

          const now = Math.floor(Date.now() / 1000);

          const header = {
            alg: 'ES256',
            kid: keyId,
            typ: 'JWT'
          };

          const payload = {
            iss: issuerId,
            iat: now,
            exp: now + 300,
            aud: 'appstoreconnect-v1'
          };

          const encode = obj =>
            Buffer.from(JSON.stringify(obj)).toString('base64url');

          const signingInput =
            `${encode(header)}.${encode(payload)}`;

          const signature = crypto.sign(
            'sha256',
            Buffer.from(signingInput),
            {
              key,
              dsaEncoding: 'ieee-p1363'
            }
          );

          if (signature.length !== 64) {
            throw new Error('Invalid ES256 signature length.');
          }

          const jwt =
            `${signingInput}.${signature.toString('base64url')}`;

          fs.writeFileSync('/tmp/apple-jwt', jwt, {
            mode: 0o600
          });

          console.log('JWT generated using ES256.');
          NODE

          HTTP=$(curl -sS \
            -o /tmp/apple-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $(cat /tmp/apple-jwt)" \
            "https://api.appstoreconnect.apple.com/v1/apps?limit=1")

          echo "Apple API HTTP status: $HTTP"

          if [ "$HTTP" != "200" ]; then
            cat /tmp/apple-response.json
            echo ""
            echo "::error::Apple API authentication failed."
            exit 1
          fi

          echo "Apple API authentication successful."
          
      - name: Ensure AppIcon is 1024x1024 opaque PNG
        run: |
          ICON="Shared/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          sips -z 1024 1024 "$ICON" --out "$ICON"
          sips -s format jpeg "$ICON" --out /tmp/icon.jpg
          sips -s format png /tmp/icon.jpg --out "$ICON"
          sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON"
          
      - name: Archive iOS application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project AbfindungsOptimizer2027.xcodeproj \
            -scheme AbfindungsOptimizer2027 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40

      - name: Export and upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail

          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          mkdir -p build/export

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40

      - name: Cleanup credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f /tmp/apple-jwt
          rm -f /tmp/apple-response.json
