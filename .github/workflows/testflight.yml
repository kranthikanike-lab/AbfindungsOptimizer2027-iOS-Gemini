name: TestFlight upload

# Manual run: GitHub → Actions → "TestFlight upload" → Run workflow
on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v5

      - name: Check secrets
        run: |
          for v in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v}" ]; then echo "::error::Missing repo secret $v"; exit 1; fi
          done

      - name: Select newest Xcode (Apple requires the current SDK for uploads)
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then echo "::error::No Xcode 26 on this runner"; ls /Applications | grep -i xcode; exit 1; fi
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen & generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write API key
        run: |
          BUNDLE_ID=$(printf %s "$BUNDLE_ID" | tr -d '[:space:]'); TEAM_ID=$(printf %s "$TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]'); ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

          
      - name: Validate Apple API credentials
        run: |
          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          echo "Checking private key..."
          test -s "$KEY_FILE" || {
            echo "::error::Private key missing or empty"
            exit 1
          }

          openssl pkey -in "$KEY_FILE" -noout || {
            echo "::error::Invalid private key"
            exit 1
          }

          echo "Checking Apple API authentication..."

          NOW=$(date +%s)
          EXP=$((NOW + 300))

          HEADER=$(printf '{"alg":"ES256","kid":"%s","typ":"JWT"}' "$ASC_KEY_ID" | openssl base64 -A | tr '+/' '-_' | tr -d '=')

          PAYLOAD=$(printf '{"iss":"%s","iat":%s,"exp":%s,"aud":"appstoreconnect-v1"}' "$ASC_ISSUER_ID" "$NOW" "$EXP" | openssl base64 -A | tr '+/' '-_' | tr -d '=')

          SIGNATURE=$(printf '%s' "$HEADER.$PAYLOAD" | openssl dgst -sha256 -sign "$KEY_FILE" -binary | openssl base64 -A | tr '+/' '-_' | tr -d '=')

          TOKEN="$HEADER.$PAYLOAD.$SIGNATURE"

          HTTP=$(curl -sS -o /tmp/apple-response.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.appstoreconnect.apple.com/v1/apps?limit=1")

          echo "Apple API HTTP status: $HTTP"

          if [ "$HTTP" != "200" ]; then
            cat /tmp/apple-response.json
            exit 1
          fi

          echo "Apple API authentication successful"


      - name: Archive (unsigned; signing happens during export)
        run: |
          set -o pipefail
          BUNDLE_ID=$(printf %s "$BUNDLE_ID" | tr -d '[:space:]'); TEAM_ID=$(printf %s "$TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]'); ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          xcodebuild archive \
            -project AbfindungsOptimizer2027.xcodeproj -scheme AbfindungsOptimizer2027 \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" | tail -n 40

      - name: Export & upload to TestFlight
        run: |
          set -o pipefail
          BUNDLE_ID=$(printf %s "$BUNDLE_ID" | tr -d '[:space:]'); TEAM_ID=$(printf %s "$TEAM_ID" | tr -d '[:space:]')
          ASC_KEY_ID=$(printf %s "$ASC_KEY_ID" | tr -d '[:space:]'); ASC_ISSUER_ID=$(printf %s "$ASC_ISSUER_ID" | tr -d '[:space:]')
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 40
