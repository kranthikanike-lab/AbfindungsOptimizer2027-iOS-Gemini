
name: TestFlight upload

on:
  workflow_dispatch:

jobs:
  testflight:
    runs-on: macos-26-intel
    timeout-minutes: 45

    env:
      BUNDLE_ID: ${{ secrets.BUNDLE_ID }}
      TEAM_ID: ${{ secrets.TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check secrets
        shell: bash
        run: |
          set -euo pipefail

          for v in BUNDLE_ID TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing GitHub secret: $v"
              exit 1
            fi
          done

          echo "All required secrets are present."

      - name: Select newest Xcode 26
        shell: bash
        run: |
          set -euo pipefail

          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)

          if [ -z "$XC" ]; then
            echo "::error::No Xcode 26 found"
            ls /Applications | grep -i xcode
            exit 1
          fi

          sudo xcode-select -s "$XC"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen
          xcodegen generate

      - name: Prepare Apple API key
        shell: bash
        run: |
          set -euo pipefail

          export ASC_KEY_ID="$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')"
          export ASC_ISSUER_ID="$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')"

          export BUNDLE_ID="$(printf '%s' "$BUNDLE_ID" | tr -d '[:space:]')"
          export TEAM_ID="$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')"

          mkdir -p "$HOME/private_keys"

          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          printf '%s' "$ASC_KEY_P8" > "$KEY_FILE"

          chmod 600 "$KEY_FILE"

          openssl pkey -in "$KEY_FILE" -noout

          echo "API private key structure validated."

          echo "Runner UTC time:"
          date -u

          echo "Key ID length: ${#ASC_KEY_ID}"
          echo "Issuer ID length: ${#ASC_ISSUER_ID}"

          echo "Public key fingerprint:"
          openssl pkey -in "$KEY_FILE" -pubout -outform DER |
            openssl sha256

      - name: Validate Apple API authentication
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const keyId = process.env.ASC_KEY_ID;
          const issuerId = process.env.ASC_ISSUER_ID;

          const keyPath =
            `${process.env.HOME}/private_keys/AuthKey_${keyId}.p8`;

          const key = fs.readFileSync(keyPath);

          const now = Math.floor(Date.now() / 1000);

          const header = {
            alg: 'ES256',
            kid: keyId,
            typ: 'JWT'
          };

          const payload = {
            iss: issuerId,
            iat: now,
            exp: now + 300,
            aud: 'appstoreconnect-v1'
          };

          const encode = obj =>
            Buffer.from(JSON.stringify(obj)).toString('base64url');

          const signingInput =
            `${encode(header)}.${encode(payload)}`;

          const signature = crypto.sign(
            'sha256',
            Buffer.from(signingInput),
            {
              key,
              dsaEncoding: 'ieee-p1363'
            }
          );

          if (signature.length !== 64) {
            throw new Error('Invalid ES256 signature length');
          }

          const jwt =
            `${signingInput}.${signature.toString('base64url')}`;

          fs.writeFileSync('/tmp/apple-jwt', jwt, {
            mode: 0o600
          });

          console.log('JWT generated using ES256.');
          NODE

          HTTP=$(curl -sS \
            -o /tmp/apple-response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $(cat /tmp/apple-jwt)" \
            "https://api.appstoreconnect.apple.com/v1/apps?limit=1")

          echo "Apple API HTTP status: $HTTP"

          if [ "$HTTP" != "200" ]; then
            cat /tmp/apple-response.json
            echo "::error::Apple API authentication failed."
            exit 1
          fi

          echo "Apple API authentication successful."

      - name: Archive iOS application
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project AbfindungsOptimizer2027.xcodeproj \
            -scheme AbfindungsOptimizer2027 \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            | tail -n 40

      - name: Export and upload to TestFlight
        shell: bash
        run: |
          set -euo pipefail

          KEY_FILE="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          mkdir -p build/export

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>

            <key>destination</key>
            <string>upload</string>

            <key>teamID</key>
            <string>$TEAM_ID</string>

            <key>signingStyle</key>
            <string>automatic</string>

            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_FILE" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 40

      - name: Cleanup private credentials
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          rm -f /tmp/apple-jwt
          rm -f /tmp/apple-response.json
