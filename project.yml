name: AbfindungsOptimizer2027
options:
  bundleIdPrefix: com.kranthikanike
  deploymentTarget:
    iOS: "17.0"
targets:
  AbfindungsOptimizer2027:
    type: application
    platform: iOS
    sources:
      - path: Shared
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: AbfindungsPilot
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kranthikanike.abfindungsoptimizer2027
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "27.1.0"
        TARGETED_DEVICE_FAMILY: "1"
